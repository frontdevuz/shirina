<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sizga atalgan maktub — Shirina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ivory: #F9F4EE;
      --warm-cream: #F2E9DF;
      --blush-pink: #EAD9D5;
      --dusty-rose: #D8A7AC;
      --burgundy: #743D50;
      --burgundy-dark: #582B3B;
      --muted-gold: #C6A46A;
      --gold-light: #E5D1A7;
      --text-dark: #46353A;
      --text-muted: #7B666C;
      --glass-bg: rgba(249, 244, 238, 0.85);
      --glass-border: rgba(198, 164, 106, 0.35);
      --shadow-soft: 0 20px 50px rgba(70, 53, 58, 0.10);
      --shadow-gold: 0 8px 25px rgba(198, 164, 106, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--ivory);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
    }

    .stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: 
        radial-gradient(circle at 82% 18%, rgba(255, 252, 245, 0.95) 0%, rgba(249, 244, 238, 0.6) 32%, transparent 65%),
        radial-gradient(circle at 20% 80%, rgba(216, 167, 172, 0.35) 0%, transparent 55%),
        linear-gradient(160deg, #F9F4EE 0%, #F2E9DF 42%, #EAD9D5 85%, #E3C8C4 100%);
    }

    .sunlight-rays {
      position: absolute;
      top: -25%;
      right: -15%;
      width: 110vw;
      height: 110vh;
      background: conic-gradient(
        from 200deg at 80% 15%,
        transparent 0deg,
        rgba(255, 250, 238, 0.45) 12deg,
        transparent 25deg,
        rgba(255, 247, 230, 0.35) 38deg,
        transparent 52deg,
        rgba(255, 251, 242, 0.5) 64deg,
        transparent 85deg
      );
      filter: blur(28px);
      pointer-events: none;
      z-index: 1;
      animation: pulseRays 8s ease-in-out infinite alternate;
    }

    @keyframes pulseRays {
      0% { opacity: 0.7; transform: scale(1) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.04) rotate(1.5deg); }
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.65;
    }

    #ambientCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    .editorial-frame {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(198, 164, 106, 0.32);
      pointer-events: none;
      z-index: 10;
    }
    .editorial-frame::before {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(198, 164, 106, 0.14);
    }

    /* Minimal top bar — just title */
    .top-bar {
      position: absolute;
      top: 30px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 25;
      pointer-events: none;
    }

    .brand-title {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-title .eyebrow {
      font-size: 10px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--burgundy);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .brand-title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      font-style: italic;
      color: var(--text-dark);
      letter-spacing: 0.5px;
    }

    .scene-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      pointer-events: none;
    }

    .ground-shadow {
      position: absolute;
      width: 220px;
      height: 36px;
      background: radial-gradient(ellipse at center, rgba(70, 53, 58, 0.18) 0%, rgba(70, 53, 58, 0.05) 55%, transparent 75%);
      border-radius: 50%;
      transform: translateY(78px) scale(0.2);
      opacity: 0;
      filter: blur(6px);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #doveActor {
      position: absolute;
      left: 0;
      top: 0;
      width: 280px;
      height: 240px;
      margin-left: -140px;
      margin-top: -120px;
      pointer-events: none;
      z-index: 8;
      will-change: transform, filter, opacity;
      transform-origin: center center;
    }

    #envelopeActor {
      position: relative;
      width: 320px;
      height: 210px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 7;
      will-change: transform, opacity;
      perspective: 1200px;
      transition: filter 0.35s ease;
    }
    #envelopeActor:hover {
      filter: drop-shadow(0 18px 32px rgba(116, 61, 80, 0.18));
    }

    .envelope-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(145deg, #FCF9F4 0%, #F2E7DA 100%);
      box-shadow: 
        0 20px 45px rgba(70, 53, 58, 0.14),
        0 2px 8px rgba(70, 53, 58, 0.06),
        inset 0 0 0 1px rgba(198, 164, 106, 0.45);
      transform-style: preserve-3d;
    }

    .envelope-card::after {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(198, 164, 106, 0.35);
      border-radius: 4px;
      pointer-events: none;
      z-index: 4;
    }

    .parchment-preview {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 14px;
      height: 180px;
      background: linear-gradient(180deg, #FFFDFB 0%, #F7EFE4 100%);
      border: 1px solid rgba(198, 164, 106, 0.4);
      border-radius: 4px;
      padding: 18px 20px;
      box-shadow: 0 -4px 15px rgba(70, 53, 58, 0.06);
      z-index: 1;
      transform: translateY(0px);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s, opacity 0.5s ease 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .envelope-open .parchment-preview {
      transform: translateY(-95px);
      opacity: 1;
    }

    .parchment-preview .mini-floral {
      color: var(--muted-gold);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      border-radius: 8px;
    }

    .envelope-recipient {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .envelope-recipient .for-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1px;
    }
    .envelope-recipient .girl-name {
      font-family: 'Great Vibes', cursive;
      font-size: 34px;
      color: var(--burgundy);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      line-height: 1.1;
    }

    .envelope-top-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 122px;
      z-index: 6;
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.4s;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .envelope-open .envelope-top-flap {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .wax-seal-wrapper {
      position: absolute;
      top: 98px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58px;
      height: 58px;
      z-index: 8;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    }
    #envelopeActor:hover .wax-seal-wrapper {
      transform: translate(-50%, -50%) scale(1.08);
    }
    .seal-cracking {
      animation: sealCrackAnim 0.55s ease forwards;
    }
    @keyframes sealCrackAnim {
      0% { transform: translate(-50%, -50%) scale(1); }
      30% { transform: translate(-50%, -50%) scale(1.18) rotate(-6deg); }
      60% { transform: translate(-50%, -50%) scale(0.92) rotate(6deg); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; pointer-events: none; }
    }

    .letter-prompt-ui {
      margin-top: 38px;
      text-align: center;
      z-index: 9;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .letter-prompt-ui.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .letter-prompt-ui .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 23px;
      color: var(--text-dark);
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(255,255,255,0.8);
    }

    .open-letter-btn {
      position: relative;
      background: linear-gradient(135deg, var(--burgundy) 0%, #5B2C3D 100%);
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1.2px;
      padding: 14px 38px;
      border-radius: 999px;
      border: 1px solid rgba(198, 164, 106, 0.65);
      cursor: pointer;
      box-shadow: 
        0 12px 30px rgba(116, 61, 80, 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .open-letter-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 36px rgba(116, 61, 80, 0.38), 0 0 20px rgba(198, 164, 106, 0.4);
    }

    /* Transition overlay */
    #transitionOverlay {
      position: fixed;
      inset: 0;
      background: var(--ivory);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #transitionOverlay.fading {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 820px) {
      .top-bar {
        top: 18px;
        left: 20px;
        right: 20px;
      }
      #envelopeActor {
        width: 280px;
        height: 184px;
      }
    }
  </style>
</head>
<body>

  <!-- Transition overlay for smooth exit -->
  <div id="transitionOverlay"></div>

  <!-- MAIN ROMANTIC SKY STAGE -->
  <div class="stage-container">
    <div class="sunlight-rays"></div>

    <svg class="cloud-layer" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#EAD9D5" stop-opacity="0.0" />
        </linearGradient>
        <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="24" />
        </filter>
      </defs>
      <g filter="url(#cloudBlur)" fill="url(#cloudGrad)">
        <ellipse cx="1180" cy="170" rx="280" ry="70" />
        <ellipse cx="980" cy="220" rx="220" ry="55" />
        <ellipse cx="260" cy="680" rx="340" ry="85" />
        <ellipse cx="1220" cy="740" rx="290" ry="75" />
      </g>
    </svg>

    <canvas id="ambientCanvas"></canvas>
    <div class="editorial-frame"></div>

    <!-- Minimal top bar -->
    <header class="top-bar">
      <div class="brand-title">
        <span class="eyebrow">Sizga atalgan maktub • Shirina</span>
        <h1>Kabutar yetkazgan xat</h1>
      </div>
    </header>

    <!-- CENTER STAGE -->
    <main class="scene-center">
      <div id="groundShadow" class="ground-shadow"></div>

      <!-- DELIVERED INTERACTIVE VINTAGE ENVELOPE -->
      <div id="envelopeActor" title="Muhrni bosing va xatingizni oching">
        <div id="envelopeCard" class="envelope-card">
          
          <div class="parchment-preview">
            <div class="mini-floral">✦ ❀ ✦</div>
            <p style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:15px; color:#46353A;">
              "Sizning go'zal olamingiz kashf etilishga loyiq..."
            </p>
          </div>

          <svg class="envelope-pocket" viewBox="0 0 320 210" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sideFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F7EFE4" />
                <stop offset="100%" stop-color="#EADCCF" />
              </linearGradient>
              <linearGradient id="bottomFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FAF4EB" />
                <stop offset="100%" stop-color="#EFE3D4" />
              </linearGradient>
              <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#46353A" flood-opacity="0.08" />
              </filter>
            </defs>
            <polygon points="0,0 135,105 0,210" fill="url(#sideFlapGrad)" stroke="#DFCBB5" stroke-width="0.8" />
            <polygon points="320,0 185,105 320,210" fill="url(#sideFlapGrad)" stroke="#DFCBB5" stroke-width="0.8" />
            <polygon points="0,210 160,92 320,210" fill="url(#bottomFlapGrad)" stroke="#D9C3AC" stroke-width="1" filter="url(#flapShadow)" />
            <polyline points="8,208 160,97 312,208" fill="none" stroke="#C6A46A" stroke-width="0.7" stroke-opacity="0.55" />
          </svg>

          <div class="envelope-top-flap">
            <svg width="100%" height="100%" viewBox="0 0 320 122" preserveAspectRatio="none">
              <defs>
                <linearGradient id="topFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#FDFBF7" />
                  <stop offset="100%" stop-color="#EFE2D3" />
                </linearGradient>
                <filter id="topFlapDrop" x="-10%" y="-5%" width="120%" height="125%">
                  <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#46353A" flood-opacity="0.12" />
                </filter>
              </defs>
              <polygon points="0,0 160,116 320,0" fill="url(#topFlapGrad)" stroke="#D9C3AC" stroke-width="1" filter="url(#topFlapDrop)" />
              <polyline points="10,2 160,110 310,2" fill="none" stroke="#C6A46A" stroke-width="0.8" stroke-opacity="0.6" />
            </svg>
          </div>

          <div id="waxSeal" class="wax-seal-wrapper">
            <svg viewBox="0 0 80 80" width="100%" height="100%">
              <defs>
                <radialGradient id="burgundyWax" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#9E556D" />
                  <stop offset="45%" stop-color="#743D50" />
                  <stop offset="85%" stop-color="#522635" />
                  <stop offset="100%" stop-color="#3D1A26" />
                </radialGradient>
                <filter id="waxDrop" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2B141C" flood-opacity="0.38" />
                </filter>
              </defs>
              <path filter="url(#waxDrop)" fill="url(#burgundyWax)" stroke="#8A495F" stroke-width="0.8"
                d="M40,5 C47,5 51,8 57,10 C63,12 68,17 70,23 C72,29 75,33 75,40 C75,47 72,51 70,57 C68,63 63,68 57,70 C51,72 47,75 40,75 C33,75 29,72 23,70 C17,68 12,63 10,57 C8,51 5,47 5,40 C5,33 8,29 10,23 C12,17 17,12 23,10 C29,8 33,5 40,5 Z" />
              <circle cx="40" cy="40" r="24" fill="none" stroke="#C6A46A" stroke-width="1.2" stroke-opacity="0.75" />
              <circle cx="40" cy="40" r="21" fill="none" stroke="#3D1A26" stroke-width="1.5" stroke-opacity="0.5" />
              <path d="M40,50 C40,50 28,42 28,34 C28,29.5 31.5,26.5 35.5,26.5 C38,26.5 39.5,28 40,29.5 C40.5,28 42,26.5 44.5,26.5 C48.5,26.5 52,29.5 52,34 C52,42 40,50 40,50 Z"
                fill="#C6A46A" fill-opacity="0.85" />
            </svg>
          </div>

          <div class="envelope-recipient">
            <span class="for-label">Siz uchun:</span>
            <div id="envelopeNameDisplay" class="girl-name">Shirina</div>
          </div>
        </div>
      </div>

      <!-- CAPTION & CTA BUTTON -->
      <div id="letterPromptUI" class="letter-prompt-ui">
        <p class="subtitle">"Kimdandir sizga kichik bir baxt maktubi..."</p>
        <button id="btnOpenLetter" class="open-letter-btn">
          Xatni ochish ♡
        </button>
      </div>
    </main>

    <!-- REALISTIC ARTICULATED WHITE DOVE ACTOR -->
    <div id="doveActor">
      <svg id="doveSvgMaster" viewBox="0 0 320 280" width="100%" height="100%" style="overflow: visible;">
        <defs>
          <linearGradient id="doveBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="55%" stop-color="#FAF5EE" />
            <stop offset="85%" stop-color="#EFE4DA" />
            <stop offset="100%" stop-color="#E2D0C8" />
          </linearGradient>

          <linearGradient id="nearWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="65%" stop-color="#F9F4EE" />
            <stop offset="100%" stop-color="#E7D7CE" />
          </linearGradient>

          <linearGradient id="farWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F5EDE4" />
            <stop offset="100%" stop-color="#D8C3B8" />
          </linearGradient>

          <filter id="doveGlowShadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#46353A" flood-opacity="0.16" />
          </filter>
        </defs>

        <g id="doveMasterGroup" filter="url(#doveGlowShadow)">
          
          <g id="doveFarWing" transform="translate(155, 130)">
            <path d="M 0,0 
                     C 10,-48 52,-88 105,-96 
                     C 92,-72 78,-55 96,-52 
                     C 80,-35 66,-24 82,-20 
                     C 62,-8 44,2 56,6 
                     C 34,14 14,16 -8,10 Z" 
                  fill="url(#farWingGrad)" stroke="#DFCFC6" stroke-width="0.9" />
            <path d="M 15,-22 Q 55,-58 95,-75 M 20,-10 Q 50,-32 82,-42" fill="none" stroke="#CDB8AD" stroke-width="0.8" opacity="0.6" />
          </g>

          <g id="doveTail" transform="translate(205, 148)">
            <path d="M -5,-6 
                     L 68,-26 C 75,-20 75,-10 66,-6 
                     L 74,2 C 76,10 70,16 60,15 
                     L 64,24 C 60,32 48,32 38,26 
                     L -8,8 Z" 
                  fill="url(#doveBodyGrad)" stroke="#E2D2C8" stroke-width="0.9" />
            <path d="M 5,-2 L 58,-14 M 6,3 L 62,4 M 4,7 L 52,18" fill="none" stroke="#D8C4B8" stroke-width="0.8" opacity="0.65" />
          </g>

          <g id="doveClawsGroup" transform="translate(152, 162)">
            <path d="M 0,0 Q -6,10 -12,12 M -6,10 Q -4,14 -8,16 M 6,2 Q 0,12 -6,14" fill="none" stroke="#C68B7A" stroke-width="1.8" stroke-linecap="round" />
          </g>

          <g id="doveBody">
            <path d="M 90,122 
                     C 94,106 106,98 118,102 
                     C 128,105 135,116 152,120 
                     C 175,125 198,134 212,146 
                     C 198,162 172,170 144,166 
                     C 118,162 102,146 98,132 
                     C 93,129 90,125 90,122 Z" 
                  fill="url(#doveBodyGrad)" stroke="#E5D6CC" stroke-width="1" />
            
            <path d="M 102,134 C 110,152 132,162 156,162" fill="none" stroke="#EAD9D5" stroke-width="3" stroke-linecap="round" opacity="0.7" />

            <path d="M 91,120 L 73,125 L 92,128 Z" fill="#C6A46A" stroke="#A6844A" stroke-width="0.6" stroke-linejoin="round" />

            <circle cx="103" cy="115" r="2.8" fill="#36262A" />
            <circle cx="102" cy="114" r="1.0" fill="#FFFFFF" />

            <g transform="translate(80, 125) rotate(-12)">
              <path d="M -12,4 Q 0,0 10,3" fill="none" stroke="#C6A46A" stroke-width="1.1" />
              <ellipse cx="-8" cy="1" rx="4" ry="1.8" transform="rotate(-25 -8 1)" fill="#C6A46A" opacity="0.85" />
              <ellipse cx="-1" cy="4" rx="4" ry="1.8" transform="rotate(20 -1 4)" fill="#C6A46A" opacity="0.85" />
            </g>
          </g>

          <g id="carriedEnvelopeBeak" transform="translate(76, 126)">
            <path d="M 0,0 L -8,14 M 0,0 L 8,14" fill="none" stroke="#C6A46A" stroke-width="1.4" />
            <g transform="translate(-42, 10) rotate(-8)">
              <rect x="0" y="0" width="78" height="52" rx="3.5" fill="#FAF4EB" stroke="#C6A46A" stroke-width="1.2" />
              <rect x="3" y="3" width="72" height="46" rx="2" fill="none" stroke="#C6A46A" stroke-width="0.5" stroke-opacity="0.5" />
              <polygon points="0,52 39,25 78,52" fill="#F2E6D8" stroke="#DECAB4" stroke-width="0.8" />
              <polygon points="0,0 39,29 78,0" fill="#FDFBF7" stroke="#D5BFA6" stroke-width="0.9" />
              <circle cx="39" cy="27" r="8" fill="#743D50" stroke="#522635" stroke-width="0.8" />
              <circle cx="39" cy="27" r="5.5" fill="none" stroke="#C6A46A" stroke-width="0.6" />
              <path d="M39,30.2 C39,30.2 35.2,27.5 35.2,25.3 C35.2,24 36.3,23.2 37.5,23.2 C38.3,23.2 39,23.8 39,24.3 C39,23.8 39.7,23.2 40.5,23.2 C41.7,23.2 42.8,24 42.8,25.3 C42.8,27.5 39,30.2 39,30.2 Z" fill="#C6A46A" />
            </g>
          </g>

          <g id="doveNearWing" transform="translate(144, 134)">
            <path d="M -8,2 
                     C 0,-56 48,-104 114,-114 
                     C 98,-84 82,-64 104,-60 
                     C 86,-40 70,-26 90,-22 
                     C 68,-6 50,6 66,10 
                     C 42,20 18,22 -10,12 Z" 
                  fill="url(#nearWingGrad)" stroke="#E2D2C8" stroke-width="1.1" />
            <path d="M 4,-12 C 24,-45 58,-72 98,-86" fill="none" stroke="#DFCFC5" stroke-width="1.1" />
            <path d="M 8,-2 C 32,-28 60,-46 90,-52" fill="none" stroke="#DFCFC5" stroke-width="1" />
            <path d="M 10,6 C 30,-10 52,-18 76,-20" fill="none" stroke="#DFCFC5" stroke-width="0.9" />
            <path d="M 114,-114 C 98,-84 82,-64 104,-60" fill="none" stroke="#C6A46A" stroke-width="0.8" opacity="0.45" />
          </g>

        </g>
      </svg>
    </div>

  </div>

  <script>
    /**************************************************************
     * 1. STATE & CONFIGURATION
     **************************************************************/
    const state = {
      girlName: 'Shirina',
      carrierMode: 'beak',
      speedMultiplier: 1.0,
      petalCount: 45,
      soundEnabled: true,
      phase: 'approach',
      phaseStartTime: performance.now(),
      letterOpened: false,
      typewriterTimer: null
    };

    const doveActor = document.getElementById('doveActor');
    const doveNearWing = document.getElementById('doveNearWing');
    const doveFarWing = document.getElementById('doveFarWing');
    const doveTail = document.getElementById('doveTail');
    const doveMasterGroup = document.getElementById('doveMasterGroup');
    const carriedEnvelopeBeak = document.getElementById('carriedEnvelopeBeak');
    const envelopeActor = document.getElementById('envelopeActor');
    const envelopeCard = document.getElementById('envelopeCard');
    const waxSeal = document.getElementById('waxSeal');
    const groundShadow = document.getElementById('groundShadow');
    const letterPromptUI = document.getElementById('letterPromptUI');

    /**************************************************************
     * 2. AUDIO (Synthesized)
     **************************************************************/
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playWingWhoosh(volume = 0.04) {
      if (!state.soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 0.14;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(380, audioCtx.currentTime);
        filter.Q.setValueAtTime(1.8, audioCtx.currentTime);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function playRomanticChime(notes = [523.25, 659.25, 783.99, 1046.50]) {
      if (!state.soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.11);
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.11);
          gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + idx * 0.11 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + idx * 0.11 + 1.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.11);
          osc.stop(audioCtx.currentTime + idx * 0.11 + 1.45);
        });
      } catch (e) {}
    }

    /**************************************************************
     * 3. AMBIENT CANVAS
     **************************************************************/
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth;
    let ch = window.innerHeight;

    function resizeCanvas() {
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = cw;
      canvas.height = ch;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const petals = [];
    const goldDust = [];
    const feathers = [];

    function createParticles() {
      petals.length = 0;
      for (let i = 0; i < state.petalCount; i++) {
        petals.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          size: 5 + Math.random() * 9,
          speedX: -0.35 - Math.random() * 0.55,
          speedY: 0.35 + Math.random() * 0.65,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.02,
          flip: Math.random() * Math.PI,
          flipSpeed: 0.015 + Math.random() * 0.02,
          color: Math.random() > 0.45 ? '#EAD9D5' : '#D8A7AC',
          alpha: 0.45 + Math.random() * 0.4
        });
      }

      goldDust.length = 0;
      for (let i = 0; i < 40; i++) {
        goldDust.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          r: 1 + Math.random() * 2.5,
          vy: -0.15 - Math.random() * 0.25,
          vx: (Math.random() - 0.5) * 0.2,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    createParticles();

    function spawnReleaseFeathers(x, y) {
      for (let i = 0; i < 5; i++) {
        feathers.push({
          x: x + (Math.random() - 0.5) * 40,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 0.8,
          vy: 0.5 + Math.random() * 0.5,
          swayPhase: Math.random() * Math.PI * 2,
          angle: (Math.random() - 0.5) * 0.6,
          size: 12 + Math.random() * 8,
          alpha: 0.95
        });
      }
    }

    function renderAmbientCanvas(now) {
      ctx.clearRect(0, 0, cw, ch);

      for (let i = 0; i < goldDust.length; i++) {
        const g = goldDust[i];
        g.x += g.vx;
        g.y += g.vy;
        if (g.y < -10) g.y = ch + 10;
        if (g.x < -10) g.x = cw + 10;
        if (g.x > cw + 10) g.x = -10;
        const twinkle = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.0025 + g.phase));
        ctx.save();
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(198, 164, 106, ${twinkle})`;
        ctx.shadowColor = '#C6A46A';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.x += p.speedX * state.speedMultiplier + Math.sin(now * 0.001 + i) * 0.2;
        p.y += p.speedY * state.speedMultiplier;
        p.angle += p.spin;
        p.flip += p.flipSpeed;
        if (p.y > ch + 20) { p.y = -20; p.x = Math.random() * cw; }
        if (p.x < -20) { p.x = cw + 20; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.scale(1, 0.4 + 0.6 * Math.abs(Math.cos(p.flip)));
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.bezierCurveTo(p.size, -p.size * 0.8, p.size * 0.9, p.size * 0.8, 0, p.size);
        ctx.bezierCurveTo(-p.size * 0.9, p.size * 0.8, -p.size, -p.size * 0.8, 0, -p.size);
        ctx.fill();
        ctx.restore();
      }

      for (let i = feathers.length - 1; i >= 0; i--) {
        const f = feathers[i];
        f.swayPhase += 0.03;
        f.x += Math.sin(f.swayPhase) * 0.9 + f.vx;
        f.y += f.vy;
        f.angle = Math.sin(f.swayPhase) * 0.35;
        f.alpha -= 0.0025;
        if (f.alpha <= 0 || f.y > ch + 30) { feathers.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.globalAlpha = f.alpha;
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#E5D6CC';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.ellipse(0, 0, f.size, f.size * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-f.size * 1.1, 0);
        ctx.lineTo(f.size * 1.1, 0);
        ctx.strokeStyle = '#C6A46A';
        ctx.stroke();
        ctx.restore();
      }
    }

    /**************************************************************
     * 4. ANIMATION ENGINE
     **************************************************************/
    function cubicBezier(t, p0, p1, p2, p3) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function setPhase(newPhase) {
      state.phase = newPhase;
      state.phaseStartTime = performance.now();

      if (newPhase === 'approach') {
        state.letterOpened = false;
        envelopeCard.classList.remove('envelope-open');
        waxSeal.classList.remove('seal-cracking');
        letterPromptUI.classList.remove('visible');
        carriedEnvelopeBeak.style.display = 'block';
        envelopeActor.style.opacity = '0';
        envelopeActor.style.pointerEvents = 'none';
        doveActor.style.opacity = '1';
      } else if (newPhase === 'hover') {
        carriedEnvelopeBeak.style.display = 'block';
        envelopeActor.style.opacity = '0';
        letterPromptUI.classList.remove('visible');
        doveActor.style.opacity = '1';
      } else if (newPhase === 'drop') {
        carriedEnvelopeBeak.style.display = 'none';
        envelopeActor.style.opacity = '1';
        envelopeActor.style.pointerEvents = 'auto';
        spawnReleaseFeathers(cw * 0.5, ch * 0.42);
        playRomanticChime([587.33, 739.99, 880, 1174.66]);
      } else if (newPhase === 'depart') {
        carriedEnvelopeBeak.style.display = 'none';
        envelopeActor.style.opacity = '1';
        envelopeActor.style.transform = 'translate3d(0px, 0px, 0px) rotate(0deg) scale(1)';
        letterPromptUI.classList.add('visible');
      } else if (newPhase === 'interactive') {
        carriedEnvelopeBeak.style.display = 'none';
        doveActor.style.opacity = '0';
        envelopeActor.style.opacity = '1';
        envelopeActor.style.pointerEvents = 'auto';
        envelopeActor.style.transform = 'translate3d(0px, 0px, 0px) rotate(0deg) scale(1)';
        groundShadow.style.opacity = '0.9';
        groundShadow.style.transform = 'translateY(82px) scale(1)';
        letterPromptUI.classList.add('visible');
      }
    }

    let lastFlapSign = 1;
    function articulateDoveParts(now, flapFreqHz, flapAmplitude) {
      const phaseAngle = now * 0.001 * flapFreqHz * Math.PI * 2;
      const sinVal = Math.sin(phaseAngle);
      const cosVal = Math.cos(phaseAngle);

      if (sinVal < 0 && lastFlapSign >= 0 && (state.phase === 'approach' || state.phase === 'hover' || state.phase === 'depart')) {
        playWingWhoosh(state.phase === 'hover' ? 0.045 : 0.025);
      }
      lastFlapSign = sinVal;

      const nearRot = sinVal * 32 * flapAmplitude;
      const nearScaleY = 0.72 + 0.28 * cosVal;
      doveNearWing.setAttribute('transform', `translate(144, 134) rotate(${nearRot.toFixed(2)}) scale(1, ${nearScaleY.toFixed(2)})`);

      const farRot = Math.sin(phaseAngle - 0.35) * 26 * flapAmplitude;
      const farScaleY = 0.75 + 0.25 * Math.cos(phaseAngle - 0.35);
      doveFarWing.setAttribute('transform', `translate(155, 130) rotate(${farRot.toFixed(2)}) scale(1, ${farScaleY.toFixed(2)})`);

      const tailRot = Math.cos(phaseAngle) * 7 * flapAmplitude;
      doveTail.setAttribute('transform', `translate(205, 148) rotate(${tailRot.toFixed(2)})`);

      const envSwing = Math.sin(phaseAngle - 0.6) * 5;
      carriedEnvelopeBeak.setAttribute('transform', `translate(76, 126) rotate(${envSwing.toFixed(2)})`);
    }

    function animateStage(now) {
      renderAmbientCanvas(now);

      const elapsed = (now - state.phaseStartTime) * state.speedMultiplier;
      const centerX = cw * 0.5;
      const centerY = ch * 0.44;

      if (state.phase === 'approach') {
        const duration = 3600;
        const rawT = Math.min(1, elapsed / duration);
        const t = easeOutQuart(rawT);

        const p0 = { x: cw * 1.12, y: ch * 0.06 };
        const p1 = { x: cw * 0.78, y: ch * 0.04 };
        const p2 = { x: cw * 0.64, y: ch * 0.52 };
        const p3 = { x: centerX + 24, y: centerY - 62 };

        const pos = cubicBezier(t, p0, p1, p2, p3);
        const scale = 0.16 + 0.84 * t;
        const blurPx = Math.max(0, (1 - t) * 3.8);
        const bankAngle = (1 - t) * -14 + Math.sin(rawT * Math.PI * 2) * 4;

        doveActor.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0) scale(${scale.toFixed(3)}) rotate(${bankAngle.toFixed(2)}deg)`;
        doveActor.style.filter = blurPx > 0.15 ? `blur(${blurPx.toFixed(2)}px)` : 'none';

        groundShadow.style.opacity = (t * 0.55).toFixed(2);
        groundShadow.style.transform = `translateY(82px) scale(${(0.2 + 0.7 * t).toFixed(2)})`;

        articulateDoveParts(now, 4.2, 1.0);

        if (rawT >= 1) setPhase('hover');
      } 
      else if (state.phase === 'hover') {
        const duration = 1250;
        const rawT = Math.min(1, elapsed / duration);
        const bobY = Math.sin(rawT * Math.PI * 2) * 8;
        const x = centerX + 24 * (1 - rawT);
        const y = (centerY - 62) + bobY;
        const flareTilt = 8 * Math.sin(rawT * Math.PI);

        doveActor.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1) rotate(${flareTilt.toFixed(2)}deg)`;
        doveActor.style.filter = 'none';

        groundShadow.style.opacity = '0.75';
        groundShadow.style.transform = `translateY(82px) scale(0.95)`;

        articulateDoveParts(now, 5.4, 1.15);

        if (rawT >= 1) setPhase('drop');
      } 
      else if (state.phase === 'drop') {
        const duration = 1200;
        const rawT = Math.min(1, elapsed / duration);
        const easeT = easeInOutCubic(rawT);

        const doveX = centerX - 18 * easeT;
        const doveY = (centerY - 62) - 36 * easeT;
        doveActor.style.transform = `translate3d(${doveX}px, ${doveY}px, 0) scale(1) rotate(${(6 * (1 - easeT)).toFixed(2)}deg)`;

        const startOffsetY = -55;
        const envY = startOffsetY * (1 - easeT);
        const envTilt = -8 * (1 - easeT) * Math.cos(rawT * Math.PI);
        const envScale = 0.45 + 0.55 * easeT;
        envelopeActor.style.transform = `translate3d(0px, ${envY.toFixed(1)}px, 0px) rotate(${envTilt.toFixed(2)}deg) scale(${envScale.toFixed(3)})`;

        groundShadow.style.opacity = (0.75 + 0.2 * easeT).toFixed(2);
        groundShadow.style.transform = `translateY(82px) scale(1)`;

        articulateDoveParts(now, 4.8, 1.05);

        if (rawT >= 1) setPhase('depart');
      } 
      else if (state.phase === 'depart' || state.phase === 'farewell') {
        const duration = 2800;
        const rawT = Math.min(1, elapsed / duration);
        const t = easeInOutCubic(rawT);

        const p0 = { x: centerX - 18, y: centerY - 98 };
        const p1 = { x: cw * 0.35, y: ch * 0.26 };
        const p2 = { x: cw * 0.16, y: ch * 0.12 };
        const p3 = { x: -cw * 0.12, y: ch * 0.04 };

        const pos = cubicBezier(t, p0, p1, p2, p3);
        const scale = 1.0 - 0.68 * t;
        const blurPx = t * 3.0;
        const climbAngle = 14 * (1 - t * 0.5);

        doveActor.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0) scale(${scale.toFixed(3)}) rotate(${climbAngle.toFixed(2)}deg)`;
        doveActor.style.filter = blurPx > 0.2 ? `blur(${blurPx.toFixed(2)}px)` : 'none';
        doveActor.style.opacity = (1 - Math.pow(rawT, 3)).toFixed(2);

        articulateDoveParts(now, 4.6, 1.0);

        if (rawT >= 1 && state.phase === 'depart') setPhase('interactive');
      }

      requestAnimationFrame(animateStage);
    }

    /**************************************************************
     * 5. LETTER OPENING — posts message to parent React app
     **************************************************************/
    function triggerOpenLetter() {
      if (state.letterOpened) return;
      state.letterOpened = true;

      initAudio();
      playRomanticChime([523.25, 659.25, 783.99, 987.77, 1318.51]);
      spawnReleaseFeathers(cw * 0.5, ch * 0.45);

      // Crack seal
      waxSeal.classList.add('seal-cracking');

      // Open envelope flap
      setTimeout(() => {
        envelopeCard.classList.add('envelope-open');
      }, 280);

      // After animation, fade out and notify parent
      setTimeout(() => {
        const overlay = document.getElementById('transitionOverlay');
        overlay.classList.add('fading');
        setTimeout(() => {
          window.parent.postMessage({ type: 'LETTER_OPENED' }, '*');
        }, 800);
      }, 1800);
    }

    envelopeActor.addEventListener('click', triggerOpenLetter);
    document.getElementById('btnOpenLetter').addEventListener('click', triggerOpenLetter);

    /**************************************************************
     * 6. START
     **************************************************************/
    window.onload = function () {
      setPhase('approach');
      requestAnimationFrame(animateStage);
    };
  </script>
